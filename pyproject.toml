[tool.poetry]
name = "ai-hedge-fund"
version = "0.1.0"
description = "An AI-powered hedge fund that uses multiple agents to make trading decisions"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
    { include = "src", from = "." }
]
[tool.poetry.dependencies]
python = "^3.13"
langchain = "^0.1.12"
langchain-openai = "^0.1.5"
langchain-groq = "^0.1.3"
langchain-anthropic = "^0.1.4"
langchain-community = "^0.0.27"
pydantic = "^2.6.4"
python-dotenv = "^1.0.1"
requests = "^2.31.0"
pandas = "^2.2.1"
numpy = "^1.26.4"
matplotlib = "^3.8.3"
tabulate = "^0.9.0"
colorama = "^0.4.6"
questionary = "^2.0.1"
langgraph = "^0.0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 420
target-version = ['py39']
include = '\.pyi?$'